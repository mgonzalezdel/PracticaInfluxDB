services:
  influxdb: 
    image: influxdb:3-core 
    container_name: iot-influxdb3 
    command: serve --node-id node1
    ports: 
      - "8086:8086" 
    volumes: 
      - influxdb3_data:/var/lib/influxdb3 
    environment: 
      - INFLUXDB3_ADMIN_TOKEN=EFWerM3TXUxogUZ78D1AL_dqC4RNJhIkvO1DhSJkXT40DMWtZfVsvOWbZ0ilKCIxQHU_1S7YZewNMEdhxvL_VQ==

  grafana:
    image: grafana/grafana:10.3.1
    container_name: iot-grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - influxdb

volumes:
  influxdb3_data:
  grafana_data: